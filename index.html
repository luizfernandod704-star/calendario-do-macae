<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calendário do Johnny</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topo">

        <div class="logo">
            <span>📅</span>
            <h1>Calendário do Johnny</h1>
        </div>

        <nav class="menu">

            <button id="btnCalendario">
                Calendário
            </button>

            <button id="btnGastos">
                💰 Gastos
            </button>

        </nav>

    </header>


    <main>

        <!-- CALENDÁRIO -->

        <section id="calendario">

            <div class="cabecalho-calendario">

                <button id="mesAnterior">
                    ←
                </button>

                <h2 id="mesAno">
                    Setembro 2026
                </h2>

                <button id="mesProximo">
                    →
                </button>

            </div>


            <div class="semana">

                <div>DOM</div>
                <div>SEG</div>
                <div>TER</div>
                <div>QUA</div>
                <div>QUI</div>
                <div>SEX</div>
                <div>SÁB</div>

            </div>


            <div id="dias" class="dias"></div>

        </section>


        <!-- GASTOS -->

        <section id="gastos" class="escondido">

            <div class="titulo-gastos">

                <h2>💰 Meus Gastos</h2>

                <button id="novoGasto">
                    + Adicionar gasto
                </button>

            </div>


            <div id="listaGastos"></div>


            <div class="total-gastos">

                Total:

                R$

                <span id="totalGastos">
                    0,00
                </span>

            </div>

        </section>

    </main>


    <!-- JANELA DAS ANOTAÇÕES -->

    <div id="modal" class="modal escondido">

        <div class="modal-conteudo">

            <button
                id="fecharModal"
                class="fechar"
            >
                ×
            </button>


            <h2 id="tituloModal">
                Anotações do dia
            </h2>


            <div id="listaAnotacoes"></div>


            <input
                type="text"
                id="novaAnotacao"
                placeholder="O que você vai fazer?"
            >


            <button id="adicionarAnotacao">
                + Adicionar anotação
            </button>

        </div>

    </div>


    <!-- JANELA DOS GASTOS -->

    <div id="modalGasto" class="modal escondido">

        <div class="modal-conteudo">

            <button
                id="fecharGasto"
                class="fechar"
            >
                ×
            </button>


            <h2>
                Adicionar gasto
            </h2>


            <input
                type="text"
                id="nomeGasto"
                placeholder="Ex: Conta de luz"
            >


            <input
                type="number"
                id="valorGasto"
                placeholder="Valor"
                step="0.01"
            >


            <button id="salvarGasto">
                Salvar gasto
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
